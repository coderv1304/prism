name: Build and publish image

on:
  workflow_call:
    inputs:
      image:
        description: Image name, without the registry or owner prefix.
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile.
        required: true
        type: string
      build-args:
        description: Newline-separated Docker build arguments.
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: The immutable tag that was pushed.
        value: ${{ jobs.image.outputs.version }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/prism-${{ inputs.image }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Prism ${{ inputs.image }}
            org.opencontainers.image.description=Prism async job platform — ${{ inputs.image }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: true
          sbom: true

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/prism-${{ inputs.image }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish image digest
        run: |
          echo "### ${{ inputs.image }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
