<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Prism architecture diagram</title>
  <desc id="arch-desc">Browser to Next.js console and BFF proxy, NestJS API, Redis BullMQ queue, background worker and PostgreSQL. A GitHub Actions pipeline builds SHA-tagged images, scans them with Trivy, publishes to GHCR and deploys to Azure Container Apps.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080612"/>
      <stop offset="0.5" stop-color="#05040B"/>
      <stop offset="1" stop-color="#080513"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.35" stop-color="#D946EF"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F5B544"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121022"/>
      <stop offset="1" stop-color="#0A0817"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-fuchsia" cx="50%" cy="50%" r="50%">
      <stop stop-color="#D946EF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C4B5FD" opacity="0.09"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A78BFA"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#dots)"/>
  <ellipse cx="180" cy="120" rx="420" ry="300" fill="url(#glow-violet)"/>
  <ellipse cx="1040" cy="520" rx="380" ry="260" fill="url(#glow-fuchsia)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#spectrum)" opacity="0.9"/>

  <!-- header -->
  <text x="48" y="44" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600" letter-spacing="-0.3">Prism — system topology</text>
  <text x="48" y="63" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="11">Request path, data stores and delivery pipeline</text>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#A7A2C4">
    <line x1="836" y1="42" x2="864" y2="42" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="872" y="45">request path</text>
    <line x1="986" y1="42" x2="1014" y2="42" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
    <text x="1022" y="45">build / deploy</text>
  </g>

  <!-- private network boundary -->
  <rect x="548" y="102" width="604" height="458" rx="22" fill="#0A0817" fill-opacity="0.5" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="570" y="126" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="2">PRIVATE CONTAINER NETWORK</text>
  <rect x="950" y="112" width="180" height="20" rx="10" fill="#22D3EE" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.2"/>
  <text x="1040" y="126" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8" letter-spacing="1" text-anchor="middle">NO PUBLIC INGRESS</text>

  <!-- ============ browser ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="48" y="160" width="170" height="120" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="64" y="161" width="138" height="2.5" rx="1.25" fill="#8B5CF6" opacity="0.9"/>
  <rect x="64" y="178" width="24" height="24" rx="7" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="76" y="194" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">B</text>
  <text x="98" y="187" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">Browser</text>
  <text x="98" y="201" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">React console</text>
  <line x1="64" y1="216" x2="202" y2="216" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="64" y="234" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">Same-origin fetch only</text>
  <text x="64" y="250" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">poll 2.5s · no secrets</text>
  <text x="64" y="268" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">HTTPS</text>

  <!-- browser -> next -->
  <line x1="220" y1="220" x2="264" y2="220" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ next.js ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="270" y="150" width="200" height="140" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="286" y="151" width="168" height="2.5" rx="1.25" fill="#8B5CF6"/>
  <rect x="286" y="170" width="24" height="24" rx="7" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <text x="298" y="186" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">N</text>
  <text x="320" y="179" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">Next.js 15</text>
  <text x="320" y="193" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">Console + BFF proxy</text>
  <line x1="286" y1="208" x2="454" y2="208" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="286" y="226" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">App Router · standalone build</text>
  <text x="286" y="242" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">/api/v1/* → api:4000</text>
  <rect x="286" y="256" width="54" height="18" rx="9" fill="#22D3EE" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.18"/>
  <text x="313" y="268" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">:3000</text>

  <!-- next -> api -->
  <line x1="470" y1="220" x2="584" y2="220" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="527" y="210" fill="#8F89B0" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">proxy</text>

  <!-- ============ api ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="590" y="160" width="200" height="120" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="606" y="161" width="168" height="2.5" rx="1.25" fill="#D946EF"/>
  <rect x="606" y="178" width="24" height="24" rx="7" fill="#D946EF" fill-opacity="0.13" stroke="#D946EF" stroke-opacity="0.3"/>
  <text x="618" y="194" fill="#F0ABFC" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">A</text>
  <text x="640" y="187" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">NestJS API</text>
  <text x="640" y="201" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">REST + queue producer</text>
  <line x1="606" y1="216" x2="774" y2="216" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="606" y="234" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">validate · persist · enqueue</text>
  <text x="606" y="250" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">Prisma · Swagger · throttler</text>
  <rect x="606" y="260" width="54" height="16" rx="8" fill="#22D3EE" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.18"/>
  <text x="633" y="271" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">:4000</text>

  <!-- api -> redis -->
  <line x1="790" y1="205" x2="844" y2="205" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="817" y="197" fill="#8F89B0" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">enqueue</text>

  <!-- ============ redis ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="850" y="160" width="170" height="110" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="866" y="161" width="138" height="2.5" rx="1.25" fill="#F5B544"/>
  <rect x="866" y="178" width="24" height="24" rx="7" fill="#F5B544" fill-opacity="0.13" stroke="#F5B544" stroke-opacity="0.3"/>
  <text x="878" y="194" fill="#FCD34D" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">R</text>
  <text x="900" y="187" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">Redis 7</text>
  <text x="900" y="201" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">BullMQ transport</text>
  <line x1="866" y1="216" x2="1004" y2="216" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="866" y="234" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">prism-jobs queue</text>
  <text x="866" y="250" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">AOF · retries · locks</text>

  <!-- redis -> worker -->
  <line x1="916" y1="272" x2="742" y2="376" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="844" y="322" fill="#8F89B0" font-family="JetBrains Mono, Consolas, monospace" font-size="8" transform="rotate(-28 844 322)">consume</text>

  <!-- ============ worker ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="590" y="380" width="200" height="120" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="606" y="381" width="168" height="2.5" rx="1.25" fill="#22D3EE"/>
  <rect x="606" y="398" width="24" height="24" rx="7" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.3"/>
  <text x="618" y="414" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">W</text>
  <text x="640" y="407" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">BullMQ worker</text>
  <text x="640" y="421" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">Background processor</text>
  <line x1="606" y1="436" x2="774" y2="436" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="606" y="454" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">4 stages · 3 attempts</text>
  <text x="606" y="470" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">concurrency 4 · SIGTERM drain</text>
  <rect x="606" y="480" width="66" height="16" rx="8" fill="#22D3EE" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.18"/>
  <text x="639" y="491" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">:4001</text>

  <!-- worker -> postgres -->
  <line x1="790" y1="440" x2="844" y2="440" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="817" y="431" fill="#8F89B0" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">persist</text>

  <!-- ============ postgres ============ -->
  <g filter="url(#soft-shadow)">
    <rect x="850" y="380" width="170" height="120" rx="14" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  </g>
  <rect x="866" y="381" width="138" height="2.5" rx="1.25" fill="#34D399"/>
  <rect x="866" y="398" width="24" height="24" rx="7" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.3"/>
  <text x="878" y="414" fill="#6EE7B7" font-family="JetBrains Mono, Consolas, monospace" font-size="10" text-anchor="middle">P</text>
  <text x="900" y="407" fill="#F7F5FF" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="600">PostgreSQL 16</text>
  <text x="900" y="421" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">Source of truth</text>
  <line x1="866" y1="436" x2="1004" y2="436" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <text x="866" y="454" fill="#A7A2C4" font-family="Inter, Segoe UI, sans-serif" font-size="9.5">jobs · job_events</text>
  <text x="866" y="470" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5">durable · volume-backed</text>
  <rect x="866" y="480" width="54" height="16" rx="8" fill="#22D3EE" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.18"/>
  <text x="893" y="491" fill="#67E8F9" font-family="JetBrains Mono, Consolas, monospace" font-size="8" text-anchor="middle">:5432</text>

  <!-- api -> postgres loop -->
  <path d="M 790 248 H 1080 Q 1092 248 1092 260 V 428 Q 1092 440 1080 440 H 1024"
        fill="none" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1102" y="332" fill="#6EE7B7" font-family="JetBrains Mono, Consolas, monospace" font-size="8" opacity="0.8" transform="rotate(90 1102 332)" text-anchor="middle">state + result</text>

  <!-- ============ build & deploy ============ -->
  <rect x="48" y="590" width="1104" height="98" rx="18" fill="#0A0817" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="70" y="615" fill="#C4B5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5" letter-spacing="2">BUILD &amp; DEPLOY</text>
  <text x="70" y="632" fill="#6F6A8F" font-family="Inter, Segoe UI, sans-serif" font-size="9">GitHub Actions · same images everywhere</text>
  <line x1="70" y1="644" x2="1130" y2="644" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- nodes y=660 height 30 -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="9.5">
    <rect x="70" y="656" width="132" height="26" rx="8" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.25"/>
    <text x="136" y="673" fill="#DDD6FE" text-anchor="middle">git push → main</text>

    <line x1="202" y1="669" x2="230" y2="669" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="236" y="656" width="228" height="26" rx="8" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-opacity="0.25"/>
    <text x="350" y="673" fill="#DDD6FE" text-anchor="middle">lint · typecheck · test · build</text>

    <line x1="464" y1="669" x2="492" y2="669" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="498" y="656" width="198" height="26" rx="8" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.22"/>
    <text x="597" y="673" fill="#A5F3FC" text-anchor="middle">docker buildx + Trivy</text>

    <line x1="696" y1="669" x2="724" y2="669" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="730" y="656" width="180" height="26" rx="8" fill="#F5B544" fill-opacity="0.07" stroke="#F5B544" stroke-opacity="0.22"/>
    <text x="820" y="673" fill="#FCD34D" text-anchor="middle">GHCR · sha-&lt;commit&gt;</text>

    <line x1="910" y1="669" x2="938" y2="669" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="944" y="656" width="186" height="26" rx="8" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.22"/>
    <text x="1037" y="673" fill="#6EE7B7" text-anchor="middle">Azure Container Apps</text>
  </g>

  <text x="70" y="706" fill="#6F6A8F" font-family="JetBrains Mono, Consolas, monospace" font-size="7.5">deploy gated on scan + tests · OIDC federated credentials · previous SHA = rollback</text>
</svg>
