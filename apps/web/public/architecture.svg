<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Prism architecture diagram</title>
  <desc id="arch-desc">Browser to Next.js console and BFF proxy, NestJS API, Redis BullMQ queue, background worker and PostgreSQL. A GitHub Actions pipeline builds SHA-tagged images, scans them with Trivy, publishes to GHCR and deploys to Azure Container Apps.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c2543a"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8fc2a9"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7d7364"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#15120e"/>

  <!-- header -->
  <text x="48" y="46" fill="#f4edde" font-family="Fraunces, Georgia, serif" font-size="21" letter-spacing="-0.4">Prism / system topology</text>
  <text x="48" y="68" fill="#b7ac99" font-family="IBM Plex Mono, Consolas, monospace" font-size="9.5" letter-spacing="1">REQUEST PATH, DATA STORES AND DELIVERY PIPELINE</text>

  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5" fill="#b7ac99">
    <line x1="884" y1="45" x2="914" y2="45" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="922" y="48">request path</text>
    <line x1="1030" y1="45" x2="1060" y2="45" stroke="#7d7364" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>
    <text x="1068" y="48">build / deploy</text>
  </g>

  <!-- private network boundary -->
  <rect x="548" y="102" width="604" height="458" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="570" y="126" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5" letter-spacing="2">PRIVATE CONTAINER NETWORK</text>
  <rect x="948" y="112" width="182" height="20" fill="none" stroke="#c2543a" stroke-opacity="0.55"/>
  <text x="1039" y="126" fill="#e0785c" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="1" text-anchor="middle">NO PUBLIC INGRESS</text>

  <!-- browser -->
  <rect x="48" y="160" width="170" height="120" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="64" y="178" width="24" height="24" fill="none" stroke="#c2543a" stroke-opacity="0.6"/>
  <text x="76" y="194" fill="#e0785c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">B</text>
  <text x="98" y="187" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">Browser</text>
  <text x="98" y="201" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">React console</text>
  <line x1="64" y1="216" x2="202" y2="216" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="64" y="234" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">Same-origin fetch only</text>
  <text x="64" y="250" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">poll 2.5s · no secrets</text>
  <text x="64" y="268" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">HTTPS</text>

  <!-- browser -> next -->
  <line x1="220" y1="220" x2="264" y2="220" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- next.js -->
  <rect x="270" y="150" width="200" height="140" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="286" y="170" width="24" height="24" fill="none" stroke="#c2543a" stroke-opacity="0.6"/>
  <text x="298" y="186" fill="#e0785c" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">N</text>
  <text x="320" y="179" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">Next.js 15</text>
  <text x="320" y="193" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">Console + BFF proxy</text>
  <line x1="286" y1="208" x2="454" y2="208" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="286" y="226" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">App Router · standalone build</text>
  <text x="286" y="242" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">/api/v1/* → api:4000</text>
  <rect x="286" y="256" width="54" height="18" fill="none" stroke="#8fc2a9" stroke-opacity="0.5"/>
  <text x="313" y="268" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">:3000</text>

  <!-- next -> api -->
  <line x1="470" y1="220" x2="584" y2="220" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="527" y="210" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">proxy</text>

  <!-- api -->
  <rect x="590" y="160" width="200" height="120" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="606" y="178" width="24" height="24" fill="none" stroke="#e0ae4e" stroke-opacity="0.6"/>
  <text x="618" y="194" fill="#e0ae4e" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">A</text>
  <text x="640" y="187" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">NestJS API</text>
  <text x="640" y="201" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">REST + queue producer</text>
  <line x1="606" y1="216" x2="774" y2="216" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="606" y="234" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">validate · persist · enqueue</text>
  <text x="606" y="250" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">Prisma · Swagger · throttler</text>
  <rect x="606" y="260" width="54" height="16" fill="none" stroke="#8fc2a9" stroke-opacity="0.5"/>
  <text x="633" y="271" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">:4000</text>

  <!-- api -> redis -->
  <line x1="790" y1="205" x2="844" y2="205" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="817" y="197" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">enqueue</text>

  <!-- redis -->
  <rect x="850" y="160" width="170" height="110" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="866" y="178" width="24" height="24" fill="none" stroke="#e0ae4e" stroke-opacity="0.6"/>
  <text x="878" y="194" fill="#e0ae4e" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">R</text>
  <text x="900" y="187" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">Redis</text>
  <text x="900" y="201" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">BullMQ transport</text>
  <line x1="866" y1="216" x2="1004" y2="216" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="866" y="234" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">prism-jobs queue</text>
  <text x="866" y="250" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">AOF · retries · locks</text>

  <!-- redis -> worker -->
  <line x1="916" y1="272" x2="742" y2="376" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="844" y="322" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" transform="rotate(-28 844 322)">consume</text>

  <!-- worker -->
  <rect x="590" y="380" width="200" height="120" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="606" y="398" width="24" height="24" fill="none" stroke="#8fc2a9" stroke-opacity="0.6"/>
  <text x="618" y="414" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">W</text>
  <text x="640" y="407" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">BullMQ worker</text>
  <text x="640" y="421" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">Background processor</text>
  <line x1="606" y1="436" x2="774" y2="436" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="606" y="454" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">4 stages · 3 attempts</text>
  <text x="606" y="470" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">concurrency 4 · SIGTERM drain</text>
  <rect x="606" y="480" width="66" height="16" fill="none" stroke="#8fc2a9" stroke-opacity="0.5"/>
  <text x="639" y="491" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">:4001</text>

  <!-- worker -> postgres -->
  <line x1="790" y1="440" x2="844" y2="440" stroke="#c2543a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="817" y="431" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">persist</text>

  <!-- postgres -->
  <rect x="850" y="380" width="170" height="120" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.18"/>
  <rect x="866" y="398" width="24" height="24" fill="none" stroke="#8fc2a9" stroke-opacity="0.6"/>
  <text x="878" y="414" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" text-anchor="middle">P</text>
  <text x="900" y="407" fill="#f4edde" font-family="Manrope, Arial, sans-serif" font-size="12.5" font-weight="600">PostgreSQL 16</text>
  <text x="900" y="421" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">Source of truth</text>
  <line x1="866" y1="436" x2="1004" y2="436" stroke="#f4edde" stroke-opacity="0.12"/>
  <text x="866" y="454" fill="#b7ac99" font-family="Manrope, Arial, sans-serif" font-size="9.5">jobs · job_events</text>
  <text x="866" y="470" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5">durable · volume-backed</text>
  <rect x="866" y="480" width="54" height="16" fill="none" stroke="#8fc2a9" stroke-opacity="0.5"/>
  <text x="893" y="491" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" text-anchor="middle">:5432</text>

  <!-- api -> postgres loop -->
  <path d="M 790 248 H 1080 Q 1092 248 1092 260 V 428 Q 1092 440 1080 440 H 1024"
        fill="none" stroke="#8fc2a9" stroke-opacity="0.65" stroke-width="1.3" marker-end="url(#arrow-sage)"/>
  <text x="1102" y="332" fill="#8fc2a9" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" opacity="0.85" transform="rotate(90 1102 332)" text-anchor="middle">state + result</text>

  <!-- build and deploy -->
  <rect x="48" y="590" width="1104" height="98" fill="#1c1813" stroke="#f4edde" stroke-opacity="0.15"/>
  <text x="70" y="615" fill="#e0ae4e" font-family="IBM Plex Mono, Consolas, monospace" font-size="8.5" letter-spacing="2">BUILD &amp; DEPLOY</text>
  <text x="70" y="632" fill="#7d7364" font-family="Manrope, Arial, sans-serif" font-size="9">GitHub Actions · same images everywhere</text>
  <line x1="70" y1="644" x2="1130" y2="644" stroke="#f4edde" stroke-opacity="0.1"/>

  <g font-family="Manrope, Arial, sans-serif" font-size="9.5">
    <rect x="70" y="656" width="132" height="26" fill="none" stroke="#c2543a" stroke-opacity="0.55"/>
    <text x="136" y="673" fill="#f4edde" text-anchor="middle">git push → main</text>

    <line x1="202" y1="669" x2="230" y2="669" stroke="#7d7364" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="236" y="656" width="228" height="26" fill="none" stroke="#c2543a" stroke-opacity="0.55"/>
    <text x="350" y="673" fill="#f4edde" text-anchor="middle">lint · typecheck · test · build</text>

    <line x1="464" y1="669" x2="492" y2="669" stroke="#7d7364" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="498" y="656" width="198" height="26" fill="none" stroke="#e0ae4e" stroke-opacity="0.55"/>
    <text x="597" y="673" fill="#f4edde" text-anchor="middle">docker buildx + Trivy</text>

    <line x1="696" y1="669" x2="724" y2="669" stroke="#7d7364" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="730" y="656" width="180" height="26" fill="none" stroke="#e0ae4e" stroke-opacity="0.55"/>
    <text x="820" y="673" fill="#f4edde" text-anchor="middle">GHCR · sha-&lt;commit&gt;</text>

    <line x1="910" y1="669" x2="938" y2="669" stroke="#7d7364" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-muted)"/>

    <rect x="944" y="656" width="186" height="26" fill="none" stroke="#8fc2a9" stroke-opacity="0.55"/>
    <text x="1037" y="673" fill="#f4edde" text-anchor="middle">Azure Container Apps</text>
  </g>

  <text x="70" y="706" fill="#7d7364" font-family="IBM Plex Mono, Consolas, monospace" font-size="7.5">deploy gated on scan + tests · OIDC federated credentials · previous SHA = rollback</text>
</svg>
